<p-toast position="top-right" />
<p-confirmdialog [style]="{ width: '30rem' }" [breakpoints]="{ '640px': '92vw' }" />

<header class="barra">
  <div class="contenedor barra-interior">
    <a class="marca" routerLink="/votar">
      <span class="logo"><i class="pi pi-box"></i></span>
      <span>
        <strong>Votación distribuida</strong>
        <small>Java RMI · Raft · WebSocket</small>
      </span>
    </a>

    <nav class="navegacion" aria-label="Vistas">
      @for (s of secciones; track s.ruta) {
        <a [routerLink]="s.ruta" routerLinkActive="activa">
          <i [class]="s.icono"></i>
          <span>{{ s.etiqueta }}</span>
        </a>
      }
    </nav>

    <div class="acciones">
      <p-button
        label="Vaciar todo"
        icon="pi pi-eraser"
        severity="danger"
        [text]="true"
        size="small"
        [loading]="vaciando()"
        (onClick)="confirmarVaciado()"
        pTooltip="Borra votos, logs y archivos para empezar la demostración de cero"
        tooltipPosition="bottom"
      />
      <p-tag
        [severity]="eventos.conectado() ? 'success' : 'danger'"
        [icon]="eventos.conectado() ? 'pi pi-wifi' : 'pi pi-ban'"
        [value]="eventos.conectado() ? 'En vivo · ' + eventos.total() : 'Sin conexión'"
        pTooltip="Eventos recibidos por WebSocket desde el gateway"
        tooltipPosition="bottom"
      />
      <p-button
        [icon]="oscuro() ? 'pi pi-sun' : 'pi pi-moon'"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        (onClick)="alternarTema()"
        [ariaLabel]="oscuro() ? 'Usar tema claro' : 'Usar tema oscuro'"
      />
    </div>
  </div>
</header>

<main class="contenedor contenido">
  @if (despertando()) {
    <p-message severity="warn" icon="pi pi-spin pi-spinner" class="aviso-servidor">
      Conectando con el servidor… Si estaba dormido (plan gratuito de Render), puede tardar hasta un minuto en despertar.
    </p-message>
  }
  <router-outlet />
</main>
